name: appstore-screenshot-generator

services:
  appstore-screenshot-generator:
    # Built by GitHub Actions (.github/workflows/deploy.yml); TAG is the commit SHA of the deploy.
    image: ghcr.io/linkandreas/appstore-screenshot-generator:${TAG:-latest}
    container_name: appstore-screenshot-generator
    # No published ports: the cloudflared container on the `web` network reaches it at
    # http://appstore-screenshot-generator:32775 and serves it (with HTTPS) at the domain.
    networks:
      - web
    restart: unless-stopped

  # MCP server for AI agents; the web container proxies https://<domain>/mcp to it.
  appstore-screenshot-mcp:
    image: ghcr.io/linkandreas/appstore-screenshot-mcp:${TAG:-latest}
    container_name: appstore-screenshot-mcp
    environment:
      PUBLIC_URL: https://screenshots.linkandreas.de/mcp
    networks:
      - web
    restart: unless-stopped
    # Rendering is CPU and memory heavy; keep it from starving the other services on the VPS.
    cpus: 1.5
    mem_limit: 1g

networks:
  web:
    external: true
